name: Veille hebdo

# Le PoC Streamlit tourne en local, mais les articles qu'il affiche sont
# lus dans veille/articles_veille.json, qui est versionne. Ce workflow
# relance le scraping chaque semaine et commite le json a jour : il suffit
# d'un git pull pour que le PoC local affiche les derniers articles.
on:
  schedule:
    # tous les lundis a 7h UTC
    - cron: "0 7 * * 1"
  # pour pouvoir le lancer a la main depuis l'onglet Actions
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    # sans ca le job ne peut pas pusher le json mis a jour
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[veille]"
      # --with-deps installe en plus les librairies systeme dont chromium
      # a besoin, sinon le navigateur ne se lance pas sur un runner vide
      - run: playwright install --with-deps chromium
      - run: python -m veille.veille_scraping

      - name: Commit du json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add veille/articles_veille.json
          # --quiet sort en erreur s'il y a quelque chose a commiter, donc
          # le git commit ne tourne que dans ce cas la
          git diff --cached --quiet || git commit -m "Met a jour les articles de veille"
          git push
