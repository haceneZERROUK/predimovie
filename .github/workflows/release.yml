name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # version figee (pas juste "python-semantic-release") : un pip install
      # sans contrainte a deja resout une combinaison incompatible avec
      # GitPython (erreur "Actor has no attribute name_email_regex")
      - run: pip install "python-semantic-release==10.6.1"

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version && semantic-release publish
