name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev,veille]"
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: predimovie
          POSTGRES_PASSWORD: predimovie
          POSTGRES_DB: predimovie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predimovie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://predimovie:predimovie@localhost:5432/predimovie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev,veille]"
      - run: pytest --cov

  # packaging : construit et publie les 4 images du projet (C13/C18/C19).
  # Seulement sur main, une fois les tests verts - jamais sur les PR.
  build-images:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { nom: backend, contexte: ., dockerfile: ./backend/Dockerfile }
          - { nom: frontend, contexte: ./frontend_django, dockerfile: ./frontend_django/Dockerfile }
          - { nom: scraper, contexte: ., dockerfile: ./data_engineering/Dockerfile }
          - { nom: veille, contexte: ., dockerfile: ./veille/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.contexte }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service.nom }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service.nom }}:${{ github.sha }}
