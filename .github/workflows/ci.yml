name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev,veille]"
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: predimovie
          POSTGRES_PASSWORD: predimovie
          POSTGRES_DB: predimovie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predimovie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://predimovie:predimovie@localhost:5432/predimovie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev,veille]"
      - run: pytest --cov

  # packaging : construit et publie les 4 images du projet (C13/C18/C19).
  # Seulement sur main, une fois les tests verts - jamais sur les PR.
  build-images:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { nom: backend, contexte: ., dockerfile: ./backend/Dockerfile }
          - { nom: frontend, contexte: ./frontend_django, dockerfile: ./frontend_django/Dockerfile }
          - { nom: scraper, contexte: ., dockerfile: ./data_engineering/Dockerfile }
          - { nom: veille, contexte: ., dockerfile: ./veille/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      # ghcr.io exige un nom d'image tout en minuscules ; github.repository
      # garde la casse du pseudo GitHub (ex: haceneZERROUK), d'ou l'echec
      # "repository name must be lowercase" sans cette conversion
      - name: Nom du repo en minuscules
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.contexte }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}-${{ matrix.service.nom }}:latest
            ghcr.io/${{ env.REPO_LC }}-${{ matrix.service.nom }}:${{ github.sha }}

  # deploiement : met en ligne sur Railway une fois les images publiees.
  # Sans cette etape la chaine s'arretait a la publication et le
  # deploiement se faisait a la main, donc du code fusionne pouvait rester
  # des heures sans etre en ligne.
  deploiement:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      # un service a la fois : si le backend echoue, on ne met pas non plus
      # le frontend en ligne, il appelle une API qui n'a pas demarre
      max-parallel: 1
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - name: Mise en ligne du service ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # tant que le jeton n'est pas configure on ne fait pas echouer la
          # chaine : le reste du travail est valide, seul l'envoi manque
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN absent : deploiement ignore."
            exit 0
          fi
          railway up --service ${{ matrix.service }} --ci
