[project]
name = "predimovie"
version = "0.1.0"
description = "Système de recommandation de films (certification Simplon) : ETL N8n, PostgreSQL, FastAPI + Scikit-Learn/MLflow, PoC Streamlit, front Django."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    "joblib>=1.4",
    "streamlit>=1.38",
    "django>=5.1",
    # sert a servir les fichiers statiques du front (cf settings.py). Il
    # etait deja dans frontend_django/requirements.txt pour l'image Docker,
    # mais pas ici, du coup les tests Django plantaient a l'import en CI.
    "whitenoise>=6.7",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "rapidfuzz>=3.14.5",
    "xgboost>=3.2.0",
    "catboost>=1.2.10",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "python-semantic-release>=9.8",
    "pytest-django>=4.14.0",
]
# a part du reste : seule veille/ en a besoin (scraping du blog de veille
# hebdomadaire), pas la peine d'alourdir les images backend/frontend/scraper
veille = [
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "database", "data_engineering", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend_django/*/migrations", "database/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) en valeur par defaut, c'est l'idiome standard de FastAPI,
# pas le piege habituel des arguments par defaut mutables
extend-immutable-calls = ["fastapi.Depends"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "(frontend_django/.*/migrations|database/alembic/versions)"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "database/tests", "data_engineering/tests", "ml/tests", "veille/tests", "frontend_django/predictions"]
DJANGO_SETTINGS_MODULE = "predimovie_web.settings"
pythonpath = ["frontend_django"]

[tool.semantic_release]
version_variables = ["pyproject.toml:project.version"]
branch = "main"
build_command = ""
