services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_runs:/mlruns
      - mlflow_artifacts:/mlartifacts

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file: .env
    environment:
      # en dur "postgres" (le nom du service) au lieu de ${DATABASE_URL} :
      # ce dernier pointe vers "localhost", ce qui marche depuis la machine
      # mais pas depuis un conteneur (localhost = le conteneur lui-meme)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TRAIN_API_KEY: ${TRAIN_API_KEY}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  frontend:
    build:
      context: ./frontend_django
    env_file: .env
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "8080:8000"
    depends_on:
      - backend

  scraper:
    build:
      context: .
      dockerfile: ./data_engineering/Dockerfile
    env_file: .env
    environment:
      # meme raison que pour "backend" : "postgres" en dur, pas ${DATABASE_URL}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TMDB_API_KEY: ${TMDB_API_KEY}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: ./veille/Dockerfile
    ports:
      - "8501:8501"

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - scraper

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - postgres

volumes:
  postgres_data:
  mlflow_runs:
  mlflow_artifacts:
  n8n_data:
  grafana_data:
  prometheus_data:
