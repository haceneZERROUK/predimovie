{% extends "predictions/auth_base.html" %}
{% load static %}
{% block contenu %}
<div class="bg-panel border border-hair p-8 w-full">
  <div class="flex items-center justify-center mb-2">
    <img src="{% static 'predictions/logo-wordmark.png' %}" alt="Predimovie" class="h-9">
  </div>
  <div class="label-caps text-ink-tertiary text-center mb-8">Acces cinema partenaire</div>

  <form method="post" class="space-y-6">
    {% csrf_token %}
    <div>
      <label for="mail" class="block label-caps text-ink-tertiary mb-2">Mail</label>
      <input type="email" id="mail" name="mail" required
        class="w-full px-3 py-2 bg-ink border border-hair text-ink-primary focus:outline-none focus:border-accent text-sm"
        placeholder="proprietaire@cinema.fr">
    </div>
    <div>
      <label for="mot_de_passe" class="block label-caps text-ink-tertiary mb-2">Mot de passe</label>
      <input type="password" id="mot_de_passe" name="mot_de_passe" required
        class="w-full px-3 py-2 bg-ink border border-hair text-ink-primary focus:outline-none focus:border-accent text-sm"
        placeholder="••••••••">
    </div>
    <button type="submit"
      class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-accent text-ink-primary label-caps font-semibold transition">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="0"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Se connecter
    </button>
  </form>
</div>
{% endblock %}
