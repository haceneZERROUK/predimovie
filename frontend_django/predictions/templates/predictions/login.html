{% extends "predictions/auth_base.html" %}
{% block contenu %}
<div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full">
  <div class="flex items-center justify-center space-x-3 mb-8">
    <span class="text-3xl">🎬</span>
    <h1 class="text-2xl font-bold text-white">Predimovie</h1>
  </div>

  <form method="post" class="space-y-6">
    {% csrf_token %}
    <div>
      <label for="mail" class="block text-sm font-medium text-gray-300 mb-2">Mail</label>
      <input type="email" id="mail" name="mail" required
        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
        placeholder="proprietaire@cinema.fr">
    </div>
    <div>
      <label for="mot_de_passe" class="block text-sm font-medium text-gray-300 mb-2">Mot de passe</label>
      <input type="password" id="mot_de_passe" name="mot_de_passe" required
        class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
        placeholder="••••••••">
    </div>
    <button type="submit"
      class="w-full flex items-center justify-center px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
      Se connecter
    </button>
  </form>
</div>
{% endblock %}
