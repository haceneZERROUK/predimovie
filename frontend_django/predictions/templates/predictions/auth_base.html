{% load static %}
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predimovie</title>
<link rel="icon" type="image/svg+xml" href="{% static 'predictions/logo.svg' %}">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Courier New', monospace; background: #08090b; }
  .bg-ink { background: #08090b; }
  .bg-panel { background: #0c0d10; }
  .border-hair { border-color: #27272a; }
  .text-ink-primary { color: #fafafa; }
  .text-ink-secondary { color: #a1a1aa; }
  .text-ink-tertiary { color: #71717a; }
  .text-accent { color: #8b5cf6; }
  .bg-accent { background: #8b5cf6; }
  .bg-accent:hover { background: #7c3aed; }
  .label-caps { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  a { color: #8b5cf6; }
  a:hover { color: #a78bfa; }
</style>
</head>
<body class="min-h-screen bg-ink flex items-center justify-center">

<div class="w-full max-w-md">
  {% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="px-4 py-3 text-sm border-l-2 bg-panel
      {% if message.tags == 'error' %}border-red-500 text-red-400
      {% elif message.tags == 'success' %}border-green-500 text-green-400
      {% else %}border-yellow-500 text-yellow-400{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  {% block contenu %}{% endblock %}
</div>

</body>
</html>
